<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TE-KG Overview SVG Concept</title>
  <style>
    :root {
      --blue: #173f78;
      --te: #2f6fbb;
      --green: #2a9d8f;
      --orange: #e76f51;
      --violet: #8f6ed5;
      --gold: #d69f1f;
      --dna: #8a98aa;
      --line: #c8d5e4;
      --paper: #f7fbff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #edf4fb;
      color: #172033;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .wrap {
      width: min(1080px, calc(100vw - 32px));
      display: grid;
      grid-template-columns: 0.86fr 1.14fr;
      gap: 28px;
      align-items: center;
      padding: 28px;
      border: 1px solid #d6e2ef;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 24px 80px rgba(23, 63, 120, 0.12);
    }

    .copy h1 {
      margin: 0 0 12px;
      color: var(--blue);
      font-size: 42px;
      line-height: 1;
    }

    .copy p {
      margin: 0;
      color: #52647b;
      font-size: 16px;
      line-height: 1.65;
    }

    .mock-frame {
      min-height: 500px;
      border: 1px solid #dbe7f4;
      border-radius: 10px;
      background:
        radial-gradient(circle at 28% 25%, rgba(47,111,187,.12), transparent 24%),
        radial-gradient(circle at 78% 76%, rgba(42,157,143,.12), transparent 26%),
        linear-gradient(180deg, #ffffff, var(--paper));
      overflow: hidden;
      position: relative;
    }

    svg {
      display: block;
      width: 100%;
      height: 500px;
    }

    .panel-title {
      fill: var(--blue);
      font-size: 16px;
      font-weight: 800;
    }

    .small-label {
      fill: #20344f;
      stroke: #fff;
      stroke-width: 4px;
      paint-order: stroke;
      font-size: 13px;
      font-weight: 750;
    }

    .tiny-label {
      fill: #5b6b7f;
      font-size: 11px;
      font-weight: 700;
    }

    .edge {
      fill: none;
      stroke: #a9bbcf;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .edge.strong { stroke-width: 4.2; stroke: rgba(47,111,187,.62); }
    .edge.green { stroke: rgba(42,157,143,.62); }
    .edge.gold { stroke: rgba(214,159,31,.7); }

    .node {
      fill: #fff;
      stroke-width: 3;
      filter: drop-shadow(0 8px 18px rgba(23,63,120,.14));
    }

    .node.te { stroke: var(--te); }
    .node.tax { stroke: #6f86a3; }
    .node.dis { stroke: var(--orange); }
    .node.fun { stroke: var(--green); }
    .node.path { stroke: var(--violet); }
    .node.ev { stroke: var(--gold); }

    .central {
      fill: #fff;
      stroke: var(--te);
      stroke-width: 4;
      filter: drop-shadow(0 12px 24px rgba(47,111,187,.22));
    }

    .central-ring {
      fill: none;
      stroke: rgba(47,111,187,.25);
      stroke-width: 8;
      animation: pulse 3.6s ease-in-out infinite;
      transform-origin: 290px 235px;
    }

    .dna {
      stroke: var(--dna);
      stroke-width: 7;
      stroke-linecap: round;
      opacity: .66;
    }

    .te-seg {
      fill: var(--te);
      stroke: #1f4f8d;
      stroke-width: 2;
    }

    .evidence-dot {
      fill: var(--gold);
      filter: drop-shadow(0 0 8px rgba(214,159,31,.7));
      animation: evidenceMove 5s ease-in-out infinite;
    }

    .evidence-dot.two {
      fill: var(--green);
      animation-delay: -1.7s;
    }

    .evidence-dot.three {
      fill: var(--orange);
      animation-delay: -3.1s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .42; }
      50% { transform: scale(1.08); opacity: .18; }
    }

    @keyframes evidenceMove {
      0%, 18% { transform: translate(0, 0); opacity: 0; }
      30% { opacity: 1; }
      62% { transform: translate(50px, -78px); opacity: 1; }
      100% { transform: translate(112px, -138px); opacity: 0; }
    }

    @media (max-width: 820px) {
      .wrap { grid-template-columns: 1fr; }
      svg { height: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .central-ring,
      .evidence-dot {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="copy">
      <h1>Overview SVG Concept</h1>
      <p>
        This is a static mockup for the right side of the TE-KG home overview.
        It shows taxonomy on the left, a central TE node, biological relation
        branches on the right, PubMed evidence below, and a grey DNA track in
        the background.
      </p>
    </section>

    <section class="mock-frame" aria-label="TE-KG overview SVG concept">
      <svg viewBox="0 0 620 500" role="img" aria-label="TE-KG concept diagram">
        <text class="panel-title" x="34" y="44">Taxonomy</text>
        <text class="panel-title" x="410" y="44">Relations</text>
        <text class="panel-title" x="54" y="430">Evidence</text>

        <!-- background DNA / TE track -->
        <line class="dna" x1="170" y1="96" x2="252" y2="96"></line>
        <line class="dna" x1="340" y1="96" x2="476" y2="96"></line>
        <rect class="te-seg" x="252" y="79" width="88" height="34" rx="8"></rect>
        <text class="small-label" x="296" y="101" text-anchor="middle">TE locus</text>

        <!-- taxonomy branch -->
        <path class="edge" d="M96 86 C122 112, 136 142, 154 174"></path>
        <path class="edge" d="M154 174 C176 194, 202 212, 236 226"></path>
        <circle class="node tax" cx="96" cy="86" r="28"></circle>
        <circle class="node tax" cx="154" cy="174" r="27"></circle>
        <circle class="node tax" cx="236" cy="226" r="25"></circle>
        <text class="small-label" x="96" y="91" text-anchor="middle">Class I</text>
        <text class="small-label" x="154" y="179" text-anchor="middle">LINE</text>
        <text class="small-label" x="236" y="231" text-anchor="middle">L1</text>

        <!-- central TE -->
        <circle class="central-ring" cx="290" cy="235" r="62"></circle>
        <circle class="central" cx="290" cy="235" r="52"></circle>
        <text class="small-label" x="290" y="231" text-anchor="middle">L1HS</text>
        <text class="tiny-label" x="290" y="251" text-anchor="middle">central TE</text>

        <!-- connections from taxonomy to central TE -->
        <path class="edge strong" d="M260 229 C270 230, 276 232, 286 235"></path>

        <!-- relation branches -->
        <path class="edge strong" d="M338 217 C390 176, 424 132, 476 100"></path>
        <path class="edge green" d="M342 242 C398 246, 440 250, 494 248"></path>
        <path class="edge" d="M330 272 C382 316, 424 356, 486 386"></path>
        <path class="edge" d="M324 202 C382 208, 432 198, 522 172"></path>

        <circle class="node dis" cx="488" cy="100" r="32"></circle>
        <circle class="node fun" cx="506" cy="248" r="34"></circle>
        <circle class="node path" cx="498" cy="390" r="31"></circle>
        <circle class="node fun" cx="534" cy="168" r="27"></circle>
        <text class="small-label" x="488" y="105" text-anchor="middle">Disease</text>
        <text class="small-label" x="506" y="246" text-anchor="middle">Function</text>
        <text class="tiny-label" x="506" y="263" text-anchor="middle">genome stability</text>
        <text class="small-label" x="498" y="395" text-anchor="middle">Pathway</text>
        <text class="small-label" x="534" y="173" text-anchor="middle">Gene</text>

        <!-- evidence branch -->
        <path class="edge gold" d="M268 284 C232 326, 184 358, 118 386"></path>
        <path class="edge gold" d="M296 290 C290 332, 292 362, 284 406"></path>
        <path class="edge gold" d="M326 282 C360 330, 386 360, 430 404"></path>
        <circle class="node ev" cx="118" cy="386" r="25"></circle>
        <circle class="node ev" cx="284" cy="406" r="25"></circle>
        <circle class="node ev" cx="430" cy="404" r="25"></circle>
        <text class="small-label" x="118" y="391" text-anchor="middle">PMID</text>
        <text class="small-label" x="284" y="411" text-anchor="middle">Paper</text>
        <text class="small-label" x="430" y="409" text-anchor="middle">JCR</text>

        <!-- moving evidence dots, starting around evidence nodes and moving toward central relation -->
        <circle class="evidence-dot" cx="142" cy="378" r="5"></circle>
        <circle class="evidence-dot two" cx="284" cy="396" r="5"></circle>
        <circle class="evidence-dot three" cx="420" cy="388" r="5"></circle>
      </svg>
    </section>
  </main>
</body>
</html>
